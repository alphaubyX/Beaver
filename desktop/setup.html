<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
  <title>Connect to Beaver</title>
  <style>
    :root { --bg: #f4efe6; --panel: #fff; --text: #2d2a26; --muted: #776f64; --line: #e3dccf; --accent: #c7792b; --danger: #c0392b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d1b19; --panel: #2a2724; --text: #efe9e1; --muted: #a99f93; --line: #3d3833; --accent: #e09a52; --danger: #ef6b5b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 'Segoe UI', system-ui, sans-serif; padding: 16px; }
    form { width: min(440px, 100%); background: var(--panel); padding: 2rem; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.12); display: flex; flex-direction: column; gap: .9rem; }
    h1 { margin: 0; font-size: 1.4rem; display: flex; align-items: center; gap: .6rem; }
    h1 img { width: 40px; height: 40px; }
    p { margin: 0; color: var(--muted); }
    label { font-weight: 600; font-size: .85rem; color: var(--muted); display: flex; flex-direction: column; gap: .35rem; }
    input { padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: var(--panel); color: var(--text); }
    button { padding: .65rem; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; }
    .error { color: var(--danger); min-height: 1.3em; font-size: .9rem; }
  </style>
</head>
<body>
  <form id="f">
    <h1><img src="icon.svg" alt="">Connect to Beaver</h1>
    <p>Enter the address of your Beaver server — for example <code>http://localhost:3000</code> or <code>https://tasks.example.com</code>.</p>
    <label>Server address <input id="url" type="text" required autofocus placeholder="http://localhost:3000"></label>
    <div class="error" id="err" role="alert"></div>
    <button id="go" type="submit">Connect</button>
  </form>
  <script>
    const input = document.getElementById('url');
    input.value = new URLSearchParams(location.search).get('current') || 'http://localhost:3000';
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      const btn = document.getElementById('go');
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Connecting…';
      try {
        await window.beaverDesktop.saveServer(input.value);
      } catch (ex) {
        err.textContent = String(ex.message || ex).replace(/^Error invoking remote method '[^']+': (Error: )?/, '') || 'Could not connect.';
        btn.disabled = false;
        btn.textContent = 'Connect';
      }
    });
  </script>
</body>
</html>
